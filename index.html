<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Juego La China - Cartas Argentinas</title>
    <style>
        /* Recuperamos tu fondo y estilo original */
        body {
            background-color: #2c3e50; /* El color azulado de tu captura */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .mesa {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        /* Estilo de la carta basado en tu imagen f259e9 */
        .card {
            width: 160px;
            height: 250px;
            background: white;
            border-radius: 12px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
        }

        .card-number {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .top-left { top: 10px; left: 10px; }
        .bottom-right { bottom: 10px; right: 10px; transform: rotate(180deg); }

        /* Contenedor del dibujo central (tu ilustración) */
        .card-illustration {
            width: 80%;
            height: auto;
        }

        .card-illustration img {
            width: 100%;
            height: auto;
            display: block;
        }

        button {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <div class="mesa" id="mesa">
        </div>

    <button onclick="repartir()">Repartir Cartas</button>

    <script>
        // CORRECCIÓN DE RUTAS: Según tu GitHub, están en la raíz
        const imagenesPalos = {
            'Espada': 'espada.png',
            'Oro': 'oro.png',
            'Copa': 'copa.png',
            'Basto': 'basto.png'
        };

        const valores = [1, 2, 3, 4, 5, 6, 7, 10, 11, 12];
        const palos = ['Espada', 'Oro', 'Copa', 'Basto'];

        function repartir() {
            const mesa = document.getElementById('mesa');
            mesa.innerHTML = ''; // Limpiamos la mesa

            for (let i = 0; i < 3; i++) {
                const valor = valores[Math.floor(Math.random() * valores.length)];
                const palo = palos[Math.floor(Math.random() * palos.length)];
                const imgPath = imagenesPalos[palo];

                const cardDiv = document.createElement('div');
                cardDiv.className = 'card';
                cardDiv.innerHTML = `
                    <div class="card-number top-left">${valor}</div>
                    <div class="card-illustration">
                        <img src="${imgPath}" alt="${palo}">
                    </div>
                    <div class="card-number bottom-right">${valor}</div>
                `;
                mesa.appendChild(cardDiv);
            }
        }

        // Repartir automáticamente al cargar la página
        window.onload = repartir;
    </script>
</body>
</html>
