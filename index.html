<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La China - Cartas Argentinas</title>
    <style>
        /* Volvemos al fondo verde original de tu captura */
        body {
            background-color: #0d2f1d; 
            color: #f1c40f;
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px #000;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 30px;
        }

        /* La carta estilo "La China" */
        .card-container {
            perspective: 1000px;
            margin-bottom: 30px;
        }

        .card {
            width: 260px;
            height: 400px;
            background-color: #f3e5ab; /* Color crema de carta antigua */
            border: 8px solid #fff;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
            box-sizing: border-box;
        }

        .card-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #2c3e50;
            text-align: left;
        }

        .card-illustration {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-illustration img {
            max-width: 85%;
            height: auto;
            /* Filtro opcional para que se integre con el papel antiguo */
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.2));
        }

        /* Estilo de los botones y contador */
        .deck-info {
            background-color: rgba(0,0,0,0.5);
            padding: 10px 30px;
            border-radius: 25px;
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        button {
            background-color: #d35400; /* Naranja original */
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px #a04000;
        }

        button:active {
            box-shadow: 0 2px #a04000;
            transform: translateY(2px);
        }
    </style>
</head>
<body>

    <h1>LA CHINA</h1>
    <p class="subtitle">Toca para revelar el destino</p>

    <div class="card-container" onclick="sacarCarta()">
        <div class="card" id="current-card">
            <div class="card-number" id="card-val">8</div>
            <div class="card-illustration">
                <img src="espada.png" id="card-img" alt="Palo">
            </div>
        </div>
    </div>

    <div class="deck-info">
        Cartas en el mazo: <span id="deck-count">38</span>
    </div>

    <button onclick="mezclarMazo()">MEZCLAR MAZO</button>

    <script>
        // Configuración de tus archivos subidos a GitHub
        const imagenesPalos = {
            'Espada': 'espada.png',
            'Oro': 'oro.png',
            'Copa': 'copa.png',
            'Basto': 'basto.png'
        };

        let mazo = [];
        const valores = [1, 2, 3, 4, 5, 6, 7, 10, 11, 12];
        const palos = ['Espada', 'Oro', 'Copa', 'Basto'];

        function mezclarMazo() {
            mazo = [];
            for (let palo of palos) {
                for (let valor of valores) {
                    mazo.push({ valor, palo });
                }
            }
            // Mezcla aleatoria
            mazo.sort(() => Math.random() - 0.5);
            actualizarContador();
            alert("Mazo mezclado");
        }

        function sacarCarta() {
            if (mazo.length === 0) {
                alert("¡No hay más cartas! Mezcla el mazo de nuevo.");
                return;
            }

            const carta = mazo.pop();
            document.getElementById('card-val').innerText = carta.valor;
            document.getElementById('card-img').src = imagenesPalos[carta.palo];
            actualizarContador();
        }

        function actualizarContador() {
            document.getElementById('deck-count').innerText = mazo.length;
        }

        // Inicializar al cargar
        mezclarMazo();
    </script>
</body>
</html>
