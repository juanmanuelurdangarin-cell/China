<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ArgenPoly - Fixed Edition</title>
    <style>
        :root {
            --primary: #FFD93D; --secondary: #6BCB77; --accent: #4D96FF; 
            --danger: #FF6B6B; --bg: #f3e5ab; --font: 'Segoe UI', sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: var(--font); background: radial-gradient(circle, #f3e5ab 0%, #e7d48c 100%);
            margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* MENU */
        #setup-menu {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 9000;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .menu-card {
            background: white; padding: 25px; border-radius: 30px; border: 6px solid var(--primary);
            width: 100%; max-width: 380px; text-align: center;
        }

        /* JUEGO */
        #game-container { display: none; flex-direction: column; height: 100vh; }
        #top-section { padding: 5px; display: flex; justify-content: center; flex-shrink: 0; }
        
        #board {
            display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(6, 1fr);
            gap: 3px; width: 96vw; height: 96vw; max-width: 440px; max-height: 440px;
            background: #fff; padding: 6px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .cell {
            background: #fff; border: 1px solid #eee; position: relative; 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end; 
            padding: 2px; font-size: 7px; font-weight: 900; text-transform: uppercase;
        }
        .cell-color { position: absolute; top: 0; width: 100%; height: 28%; }
        .hotel-indicator { position: absolute; top: 30%; font-size: 8px; }

        #bottom-section {
            flex: 1; background: #fff; border-radius: 25px 25px 0 0;
            padding: 15px; display: flex; flex-direction: column; overflow-y: auto;
        }

        .p-card {
            min-width: 85px; padding: 8px; border-radius: 12px; background: #f8f9fa;
            border-bottom: 4px solid #ccc; text-align: center; cursor: pointer; font-size: 11px;
        }
        .p-card.active { border-bottom-color: var(--accent); background: #eef5ff; transform: scale(1.05); }

        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 12px;
            font-weight: 900; font-size: 13px; color: white; cursor: pointer;
            text-transform: uppercase; margin-bottom: 6px;
        }
        .btn-roll { background: var(--accent); }
        .btn-buy { background: var(--secondary); }
        .btn-buy:disabled { background: #ccc !important; opacity: 0.7; cursor: not-allowed; }

        .prop-card {
            background: #fff; border-radius: 12px; padding: 10px; margin-bottom: 8px;
            border: 1px solid #eee; border-left: 10px solid; cursor: pointer;
        }
        .rent-table { display: none; font-size: 10px; margin-top: 8px; grid-template-columns: 1fr 1fr; gap: 4px; border-top: 1px dashed #eee; padding-top: 8px; }
        .prop-card.expanded .rent-table { display: grid; }

        #log {
            background: #fafafa; padding: 6px; border-radius: 10px; height: 45px;
            font-size: 9px; overflow-y: auto; margin-bottom: 8px; border: 1px solid #eee;
        }

        .token {
            width: 16px; height: 16px; border-radius: 50%; border: 2px solid white;
            position: absolute; z-index: 100; transition: 0.3s;
        }

        input, select { width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: 1px solid #ddd; }
    </style>
</head>
<body>

<div id="setup-menu">
    <div class="menu-card">
        <h1 style="color: var(--accent); margin:0; font-size:24px;">🇦🇷 ARGENPOLY</h1>
        <p style="font-weight:bold; color: var(--secondary); font-size:12px;">EDICIÓN CORREGIDA</p>
        
        <div style="text-align:left; margin-top:15px;">
            <label style="font-size:10px; font-weight:bold;">HUMANOS (MÁX 3 + MESSI)</label>
            <select id="player-qty" onchange="generateInputs()">
                <option value="1">1 Jugador</option>
                <option value="2">2 Jugadores</option>
                <option value="3">3 Jugadores</option>
            </select>
            <div id="names-box"></div>
        </div>
        <button class="btn btn-roll" onclick="initGame()" style="margin-top:20px;">¡JUGAR!</button>
    </div>
</div>

<div id="game-container">
    <div id="top-section">
        <div id="board">
            <div style="grid-column: 2/6; grid-row: 2/6; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                <div id="dice-val" style="font-size: 40px;">🎲</div>
                <div id="turn-label" style="font-weight:900; font-size:9px; color:var(--accent); border:1px solid #ddd; padding:3px 8px; border-radius:10px;"></div>
            </div>
        </div>
    </div>

    <div id="bottom-section">
        <div id="players-list" style="display:flex; gap:6px; overflow-x:auto; padding-bottom:8px;"></div>
        <div id="log"></div>
        <div id="action-btns">
            <button id="roll-btn" class="btn btn-roll" onclick="playTurn()">🎲 TIRAR DADOS</button>
            <button id="buy-btn" class="btn btn-buy" style="display:none;" onclick="buyCurrent
