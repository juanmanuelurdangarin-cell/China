<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Cartas Argentinas</title>
    <style>
        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #game-container {
            text-align: center;
        }

        .hand {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Estilo de la Carta */
        .card {
            width: 150px;
            height: 230px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            position: relative;
            border: 1px solid #ccc;
        }

        .card-number {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
        }

        .card-number.top { text-align: left; }
        .card-number.bottom { text-align: right; transform: rotate(180deg); }

        .card-suit {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .card-suit img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="mesa" class="hand">
        </div>
    <button onclick="repartir()">Repartir Cartas</button>
</div>

<script>
    // Configuración de las rutas según tus archivos en GitHub
    const path = "Imagenes/"; // Asegúrate de que la carpeta se llame exactamente así

    function obtenerImagenPalo(palo) {
        const archivos = {
            'Espada': path + 'espada.png',
            'Oro': path + 'oro.png',
            'Copa': path + 'copa.png',
            'Basto': path + 'basto.png'
        };
        return archivos[palo];
    }

    const palos = ['Espada', 'Oro', 'Copa', 'Basto'];
    const valores = [1, 2, 3, 4, 5, 6, 7, 10, 11, 12];

    function crearCartaAleatoria() {
        const valor = valores[Math.floor(Math.random() * valores.length)];
        const palo = palos[Math.floor(Math.random() * palos.length)];
        return { valor, palo };
    }

    function repartir() {
        const mesa = document.getElementById('mesa');
        mesa.innerHTML = ''; // Limpiar mesa

        // Repartimos 3 cartas de ejemplo
        for (let i = 0; i < 3; i++) {
            const carta = crearCartaAleatoria();
            const imagenSrc = obtenerImagenPalo(carta.palo);

            const cardHTML = `
                <div class="card">
                    <div class="card-number top">${carta.valor}</div>
                    <div class="card-suit">
                        <img src="${imagenSrc}" alt="${carta.palo}">
                    </div>
                    <div class="card-number bottom">${carta.valor}</div>
                </div>
            `;
            mesa.innerHTML += cardHTML;
        }
    }

    // Iniciar con cartas al cargar
    window.onload = repartir;
</script>

</body>
</html>
