<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Monopoly Argentina</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #74acdf, white);
    text-align: center;
}

h1 {
    color: #0033a0;
}

#board {
    display: grid;
    grid-template-columns: repeat(5, 120px);
    grid-template-rows: repeat(5, 120px);
    gap: 4px;
    margin: 20px auto;
    width: 620px;
}

.cell {
    background: white;
    border: 2px solid black;
    font-size: 12px;
    padding: 5px;
    position: relative;
}

.player {
    font-size: 18px;
    font-weight: bold;
}

.controls {
    margin-top: 20px;
}

button {
    padding: 10px 20px;
    font-size: 16px;
    background-color: #0033a0;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    background-color: #001f5c;
}

#log {
    margin-top: 20px;
    height: 120px;
    overflow-y: auto;
    background: white;
    border: 2px solid black;
    padding: 10px;
}

img {
    width: 80px;
    margin-top: 10px;
}
</style>
</head>
<body>

<h1>Monopoly Argentina 🇦🇷</h1>

<img src="https://upload.wikimedia.org/wikipedia/commons/1/1a/Flag_of_Argentina.svg">
<img src="https://upload.wikimedia.org/wikipedia/commons/3/32/Escudo_de_la_Rep%C3%BAblica_Argentina.svg">

<div id="board"></div>

<div class="controls">
    <button onclick="rollDice()">Tirar Dados</button>
    <button onclick="endGame()">Finalizar Juego</button>
</div>

<h3>Jugador 1: $<span id="money1">1500</span> | Posición: <span id="pos1">0</span></h3>
<h3>Jugador 2: $<span id="money2">1500</span> | Posición: <span id="pos2">0</span></h3>

<div id="log"></div>

<script>
const properties = [
    {name:"Salida 🇦🇷", price:0, owner:null},
    {name:"Buenos Aires - La Plata", price:100, owner:null},
    {name:"Córdoba - Córdoba Capital", price:120, owner:null},
    {name:"Santa Fe - Rosario", price:130, owner:null},
    {name:"Mendoza - Mendoza Capital", price:140, owner:null},
    {name:"San Juan - San Juan", price:150, owner:null},
    {name:"Salta - Salta Capital", price:160, owner:null},
    {name:"Tucumán - San Miguel", price:170, owner:null},
    {name:"Entre Ríos - Paraná", price:180, owner:null},
    {name:"Chubut - Comodoro Rivadavia", price:190, owner:null},
    {name:"Río Negro - Bariloche", price:200, owner:null},
    {name:"Neuquén - Neuquén Capital", price:210, owner:null},
    {name:"Misiones - Posadas", price:220, owner:null},
    {name:"Jujuy - San Salvador", price:230, owner:null},
    {name:"Cárcel", price:0, owner:null},
    {name:"La Pampa - Santa Rosa", price:240, owner:null},
    {name:"Formosa - Formosa", price:250, owner:null},
    {name:"Chaco - Resistencia", price:260, owner:null},
    {name:"Corrientes - Corrientes", price:270, owner:null},
    {name:"Ir a la Cárcel", price:0, owner:null}
];

let players = [
    {position:0, money:1500},
    {position:0, money:1500}
];

let currentPlayer = 0;

function createBoard(){
    const board = document.getElementById("board");
    properties.forEach((prop, index)=>{
        const cell = document.createElement("div");
        cell.className="cell";
        cell.id="cell"+index;
        cell.innerHTML=prop.name+"<br>$"+prop.price;
        board.appendChild(cell);
    });
}
createBoard();

function rollDice(){
    let dice = Math.floor(Math.random()*6)+1;
    let player = players[currentPlayer];

    player.position = (player.position + dice) % properties.length;

    if(player.position === 0){
        player.money += 200;
        log("Jugador "+(currentPlayer+1)+" pasó por Salida y cobró $200");
    }

    let prop = properties[player.position];

    if(prop.price > 0 && prop.owner === null){
        if(player.money >= prop.price){
            player.money -= prop.price;
            prop.owner = currentPlayer;
            log("Jugador "+(currentPlayer+1)+" compró "+prop.name);
        }
    }
    else if(prop.owner !== null && prop.owner !== currentPlayer){
        let rent = 50;
        player.money -= rent;
        players[prop.owner].money += rent;
        log("Jugador "+(currentPlayer+1)+" pagó $"+rent+" de alquiler");
    }
    else if(prop.name==="Ir a la Cárcel"){
        player.position = 14;
        log("Jugador "+(currentPlayer+1)+" fue a la Cárcel");
    }

    updateDisplay();
    currentPlayer = currentPlayer===0?1:0;
}

function updateDisplay(){
    document.getElementById("money1").innerText=players[0].money;
    document.getElementById("money2").innerText=players[1].money;
    document.getElementById("pos1").innerText=players[0].position;
    document.getElementById("pos2").innerText=players[1].position;
}

function log(text){
    document.getElementById("log").innerHTML += text+"<br>";
}

function endGame(){
    if(players[0].money > players[1].money){
        alert("Ganó Jugador 1 🇦🇷");
    } else if(players[1].money > players[0].money){
        alert("Ganó Jugador 2 🇦🇷");
    } else {
        alert("Empate 🇦🇷");
    }
}
</script>

</body>
</html>
